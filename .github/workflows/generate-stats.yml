name: Generate GitHub stats SVGs

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "generated/**"
      - "README.md"
  repository_dispatch:
    types: [profile-refresh]
  workflow_dispatch:

permissions:
  contents: write

# Shared with update-readme.yml — both workflows can be triggered by the
# same `profile-refresh` dispatch (fired by every push to the portfolio
# repos) and both commit+push to this repo's main. Without a shared
# concurrency group, two runs racing in parallel can have the second one's
# push rejected non-fast-forward. Same group name in both files queues
# them instead of racing them.
concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats SVGs
        env:
          GH_USERNAME: muhammad-jiku
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate-stats-svg.py

      - name: Generate trophies SVG
        env:
          GH_USERNAME: muhammad-jiku
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate-trophies-svg.py

      - name: Generate activity graph SVG
        env:
          GH_USERNAME: muhammad-jiku
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate-activity-graph-svg.py

      - name: Generate experience badge SVG
        run: python3 scripts/generate-experience-badge-svg.py

      - name: Generate streak stats SVG
        env:
          GH_USERNAME: muhammad-jiku
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate-streak-svg.py

      - name: Generate typing header SVG
        run: python3 scripts/generate-typing-svg.py

      - name: Generate/migrate shields.io badge SVGs
        run: python3 scripts/generate-badges-svg.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/stats.svg generated/languages.svg generated/trophies.svg generated/activity-graph.svg generated/experience-badge.svg generated/streak-stats.svg generated/typing.svg generated/badges/ README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh generated GitHub stats SVGs"
            git push
          fi
