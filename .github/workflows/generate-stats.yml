name: Generate GitHub stats SVGs

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "generated/**"
      - "README.md"
  repository_dispatch:
    types: [profile-refresh]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats SVGs
        env:
          GH_USERNAME: muhammad-jiku
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate-stats-svg.py

      - name: Generate trophies SVG
        env:
          GH_USERNAME: muhammad-jiku
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate-trophies-svg.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/stats.svg generated/languages.svg generated/trophies.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh generated GitHub stats SVGs"
            git push
          fi
