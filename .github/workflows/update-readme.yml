name: Update README with latest projects

on:
  schedule:
    # Runs once a day
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  repository_dispatch:
    types: [profile-refresh]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Latest Projects section
        env:
          GH_USERNAME: muhammad-jiku
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_REPOS_TOKEN: ${{ secrets.PRIVATE_REPOS_TOKEN }}
        run: bash scripts/update-projects.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update latest projects in README"
            git push
          fi
