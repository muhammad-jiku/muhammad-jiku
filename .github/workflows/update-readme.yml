name: Update README with latest projects

on:
  schedule:
    # Runs once a day
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  repository_dispatch:
    types: [profile-refresh]
  workflow_dispatch:

permissions:
  contents: write

# Shared with generate-stats.yml — see that file's comment for why.
concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Latest Projects section
        env:
          GH_USERNAME: muhammad-jiku
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_REPOS_TOKEN: ${{ secrets.PRIVATE_REPOS_TOKEN }}
        run: bash scripts/update-projects.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: auto-update latest projects in README"
          # The shared concurrency group only serializes this repo's own workflow runs — it
          # doesn't protect against a manual/local push landing on main in between. Rebase
          # onto the latest main and retry a few times before giving up.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
